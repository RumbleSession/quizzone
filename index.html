
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUIZZONE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111015;color:white;font-family:Arial,sans-serif}
main{max-width:850px;margin:40px auto;padding:25px;background:#eeece4;color:#19171e;min-height:85vh}
h1,h2{text-align:center}
input{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #aaa;font-size:15px}
button{padding:13px 18px;margin:5px;background:#241e2c;color:white;border:0;cursor:pointer;font-weight:bold}
button:disabled{opacity:.4;cursor:default}
.panel{background:#dedbd2;padding:15px;margin:15px 0}
.hidden{display:none}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{background:#241e2c;color:white;text-align:left}
.answer.correct{background:#39834b}
.answer.wrong{background:#b13d4d}
#status{font-size:13px;min-height:20px}
#creator{text-align:center;color:#777;font-size:12px;margin-top:35px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px;border-bottom:1px solid #bbb}
@media(max-width:600px){main{margin:0;padding:15px}#answers{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>

<section id="account">
<h1>QUIZZONE</h1>
<h2>JÁTÉKOS FIÓK</h2>

<div class="panel">
<input id="username" maxlength="16" placeholder="Felhasználónév">
<input id="food" maxlength="40" placeholder="Kedvenc ételed">

<button onclick="register()">REGISZTRÁCIÓ</button>
<button onclick="login()">BEJELENTKEZÉS</button>
<button onclick="logout()">KIJELENTKEZÉS</button>

<p id="status">Csatlakozás...</p>
</div>

<button onclick="startGame()">JÁTÉK INDÍTÁSA</button>

<h2>🏆 TOPLISTA</h2>
<table>
<thead>
<tr><th>Hely</th><th>Játékos</th><th>Pont</th><th>Idő</th></tr>
</thead>
<tbody id="leaderboard"></tbody>
</table>
<button onclick="loadLeaderboard()">TOPLISTA FRISSÍTÉSE</button>
</section>

<section id="game" class="hidden">
<h1>QUIZZONE</h1>
<div class="panel">
<p id="questionNumber"></p>
<h2 id="question"></h2>
<div id="answers"></div>
<p id="feedback"></p>
<button id="next" disabled onclick="nextQuestion()">KÖVETKEZŐ</button>
</div>
<p>Pontszám: <b id="score">0</b></p>
<p>Találatok: <b id="hits">0</b> / 20</p>
</section>

<section id="result" class="hidden">
<h1>JÁTÉK VÉGE!</h1>
<h2 id="finalScore"></h2>
<p id="finalTime"></p>
<p id="saveStatus"></p>
<button onclick="location.reload()">ÚJ JÁTÉK</button>
</section>

<div id="creator">Készítette: RumbleSession</div>
</main>

<script>
// SUPABASE BEÁLLÍTÁS
const SUPABASE_URL = "https://flksohayujnkdgegngbm.supabase.co";
const SUPABASE_KEY = "sb_publishable_bU14UHvMgw8Ovm98ECV3vg_xl6rePKR";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let playerName = "";
let score = 0;
let hits = 0;
let index = 0;
let startedAt = 0;
let elapsed = 0;
let answered = false;

// KÉRDÉSEK
const questions = [
["Melyik ország zászlaja ez?",["Magyarország","Japán","Kanada","Brazília"],1],
["Melyik ország zászlaja ez?",["Németország","Franciaország","Olaszország","Spanyolország"],0],
["Melyik ország zászlaja ez?",["Kanada","USA","Ausztrália","Japán"],0],
["Melyik ország zászlaja ez?",["Brazília","Argentína","Chile","Peru"],0],
["Melyik ország zászlaja ez?",["Norvégia","Svédország","Finnország","Dánia"],1],
["Melyik csoki ez?",["Milka","Toblerone","KitKat","Snickers"],1],
["Melyik csoki ez?",["Milka","Kinder","Mars","Bounty"],0],
["Melyik csoki ez?",["Twix","KitKat","Mars","Snickers"],1],
["Melyik csoki ez?",["Bounty","Twix","Snickers","Milky Way"],2],
["Melyik édesség ez?",["Kinder Meglepetés","Raffaello","Tic Tac","Ferrero Rocher"],0],
["Melyik alkatrész a processzor?",["CPU","RAM","SSD","GPU"],0],
["Melyik alkatrész tárolja a memóriát?",["CPU","RAM","Tápegység","Ház"],1],
["Melyik alkatrész felel a grafikáért?",["SSD","RAM","Videókártya","Alaplap"],2],
["Mi az alaplap feladata?",["Összeköti az alkatrészeket","Hangot ad","Áramot termel","Képet rögzít"],0],
["Melyik alkatrész ad áramot a gépnek?",["RAM","Tápegység","CPU","SSD"],1],
["Melyik játék ez?",["Roblox","Minecraft","Terraria","Fortnite"],1],
["Melyik játék ez?",["Sonic","Super Mario","Rayman","FIFA"],1],
["Melyik játék ez?",["Apex Legends","Fortnite","PUBG","Valorant"],1],
["Melyik játék ez?",["Fall Guys","Among Us","Brawl Stars","Stumble Guys"],1],
["Melyik játék ez?",["Rocket League","FIFA","Forza","Trackmania"],0]
];

// ANONIM SUPABASE-MUNKAMENET
async function ensureSession(){
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(data.session)return;

    const result=await db.auth.signInAnonymously();
    if(result.error)throw result.error;
}

// MEZŐK ELLENŐRZÉSE
function getFields(){
    const username=document.getElementById("username").value.trim();
    const food=document.getElementById("food").value.trim();

    if(username.length<3||username.length>16){
        throw new Error("A felhasználónév 3–16 karakter legyen!");
    }

    if(food.length<2||food.length>40){
        throw new Error("A kedvenc étel 2–40 karakter legyen!");
    }

    return {username,food};
}

function setStatus(text){
    document.getElementById("status").textContent=text;
}

// REGISZTRÁCIÓ
async function register(){
    try{
        const {username,food}=getFields();
        setStatus("Regisztráció...");

        await ensureSession();

        const {data,error}=await db.rpc(
            "register_quiz_account",
            {
                p_username:username,
                p_food:food
            }
        );

        if(error)throw error;

        const user=await db.auth.getUser();
        currentUser=user.data.user;
        playerName=data;

        setStatus("Sikeres regisztráció: "+data);

    }catch(error){
        setStatus(error.message);
    }
}

// BEJELENTKEZÉS
async function login(){
    try{
        const {username,food}=getFields();
        setStatus("Bejelentkezés...");

        await ensureSession();

        const {data,error}=await db.rpc(
            "login_quiz_account",
            {
                p_username:username,
                p_food:food
            }
        );

        if(error)throw error;

        const user=await db.auth.getUser();
        currentUser=user.data.user;
        playerName=data;

        setStatus("Sikeres bejelentkezés: "+data);

    }catch(error){
        setStatus("Hibás felhasználónév vagy kedvenc étel.");
    }
}

// KIJELENTKEZÉS
async function logout(){
    await db.auth.signOut();
    currentUser=null;
    playerName="";
    setStatus("Kijelentkeztél.");
}

// JÁTÉK INDÍTÁSA
function startGame(){
    if(!currentUser){
        alert("Először jelentkezz be!");
        return;
    }

    score=0;
    hits=0;
    index=0;
    startedAt=Date.now();

    document.getElementById("account").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    showQuestion();
}

// KÉRDÉS MEGJELENÍTÉSE
function showQuestion(){
    answered=false;
    const q=questions[index];

    document.getElementById("questionNumber").textContent=
        "KÉRDÉS "+(index+1)+" / "+questions.length;

    document.getElementById("question").textContent=q[0];
    document.getElementById("feedback").textContent="";
    document.getElementById("next").disabled=true;

    const answers=document.getElementById("answers");
    answers.replaceChildren();

    q[1].forEach((answer,n)=>{
        const button=document.createElement("button");
        button.className="answer";
        button.textContent="ABCD"[n]+". "+answer;
        button.onclick=()=>chooseAnswer(n);
        answers.appendChild(button);
    });

    updateStats();
}

// VÁLASZ
function chooseAnswer(n){
    if(answered)return;
    answered=true;

    const correct=questions[index][2];

    [...document.getElementById("answers").children]
        .forEach((button,k)=>{
            button.disabled=true;

            if(k===correct){
                button.classList.add("correct");
            }else if(k===n){
                button.classList.add("wrong");
            }
        });

    if(n===correct){
        score+=100;
        hits++;
        document.getElementById("feedback").textContent=
            "✓ HELYES VÁLASZ! +100 PONT";
    }else{
        document.getElementById("feedback").textContent=
            "✕ HIBÁS VÁLASZ!";
    }

    document.getElementById("next").disabled=false;
    updateStats();
}

// KÖVETKEZŐ KÉRDÉS
function nextQuestion(){
    if(!answered)return;

    index++;

    if(index>=questions.length){
        finishGame();
    }else{
        showQuestion();
    }
}

function updateStats(){
    document.getElementById("score").textContent=score;
    document.getElementById("hits").textContent=hits;
}

// EREDMÉNY
async function finishGame(){
    elapsed=Math.max(1,Math.floor((Date.now()-startedAt)/1000));

    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("finalScore").textContent=
        score+" / 2000 pont";

    document.getElementById("finalTime").textContent=
        "Idő: "+Math.floor(elapsed/60)+" perc "+
        (elapsed%60)+" másodperc";

    document.getElementById("saveStatus").textContent=
        "Eredmény mentése...";

    try{
        const {error}=await db.rpc(
            "save_quiz_result",
            {
                p_score:score,
                p_elapsed_seconds:elapsed,
                p_hits:hits
            }
        );

        if(error)throw error;

        document.getElementById("saveStatus").textContent=
            "✓ Eredmény sikeresen elmentve!";

    }catch(error){
        console.error(error);
        document.getElementById("saveStatus").textContent=
            "Nem sikerült elmenteni az eredményt.";
    }
}

// TOPLISTA
async function loadLeaderboard(){
    const body=document.getElementById("leaderboard");
    body.replaceChildren();

    try{
        const {data,error}=await db
            .from("quiz_results")
            .select("player_name,score,elapsed_seconds")
            .not("account_username","is",null)
            .order("score",{ascending:false})
            .order("elapsed_seconds",{ascending:true})
            .limit(10);

        if(error)throw error;

        data.forEach((entry,n)=>{
            const tr=document.createElement("tr");
            const values=[
                n+1,
                entry.player_name,
                entry.score,
                Math.floor(entry.elapsed_seconds/60)+":"+
                String(entry.elapsed_seconds%60).padStart(2,"0")
            ];

            values.forEach(value=>{
                const td=document.createElement("td");
                td.textContent=value;
                tr.appendChild(td);
            });

            body.appendChild(tr);
        });

        if(!data.length){
            body.innerHTML="<tr><td colspan='4'>Még nincs eredmény.</td></tr>";
        }

    }catch(error){
        console.error(error);
        body.innerHTML="<tr><td colspan='4'>Toplista betöltési hiba.</td></tr>";
    }
}

// INDULÁS
async function initialize(){
    try{
        await ensureSession();

        const {data,error}=await db.rpc("get_quiz_account");
        if(error)throw error;

        if(data){
            const user=await db.auth.getUser();
            currentUser=user.data.user;
            playerName=data;
            setStatus("Bejelentkezve: "+data);
        }else{
            setStatus("Regisztrálj vagy jelentkezz be!");
        }

    }catch(error){
        console.error(error);
        setStatus("Supabase kapcsolódási hiba.");
    }

    await loadLeaderboard();
}

initialize();
</script>
</body>
</html>
